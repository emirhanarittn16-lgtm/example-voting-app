# Canlı ortam (production) compose dosyası.
#   docker compose -f docker-compose.prod.yml up -d --build
#
# docker-compose.yml geliştirme içindir; bu dosyanın ondan farkları:
#   - vote: Flask debug sunucusu yerine gunicorn (Dockerfile'daki "final" aşaması)
#   - result: nodemon ve --inspect yok, doğrudan "node server.js"
#   - kaynak kod volume ile bağlanmıyor, image'ın içinde
#   - restart: unless-stopped -> sunucu yeniden başlayınca uygulama da kalkar
#   - vote/result portları yalnızca BIND_IP adresinde dinler (varsayılan 127.0.0.1);
#     sunucuya özel değer .env dosyasında tutulur (git'e girmez)
#   - seed servisi yok

services:
  vote:
    build:
      context: ./vote
      target: final
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    ports:
      - "${BIND_IP:-127.0.0.1}:8080:80"
    networks:
      - front-tier
      - back-tier
    restart: unless-stopped

  result:
    build: ./result
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BIND_IP:-127.0.0.1}:8081:80"
    networks:
      - front-tier
      - back-tier
    restart: unless-stopped

  worker:
    build:
      context: ./worker
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    networks:
      - back-tier
    restart: unless-stopped

  redis:
    image: redis:alpine
    volumes:
      - "./healthchecks:/healthchecks:ro"
    healthcheck:
      test: /healthchecks/redis.sh
      interval: "5s"
    networks:
      - back-tier
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
    volumes:
      - "db-data:/var/lib/postgresql/data"
      - "./healthchecks:/healthchecks:ro"
    healthcheck:
      test: /healthchecks/postgres.sh
      interval: "5s"
    networks:
      - back-tier
    restart: unless-stopped

volumes:
  db-data:

networks:
  front-tier:
  back-tier:
